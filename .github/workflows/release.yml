name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "Stan Bogatkin"
          git config user.email "regs.github.com@sbog.org"

      - name: Prepare
        run: make prepare

      - name: Build
        run: make build

      - name: Publish to PyPI
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: make publish

      - name: Push release commit and tags
        run: make push-release
